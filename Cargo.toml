[workspace]
resolver = "2"
members = [
    "crates/koma-app",
    "crates/koma-cli",
    "crates/koma-core",
    "crates/koma-ipc",
    "crates/koma-browser-host",
    "crates/koma-cef-fetch",
]
default-members = [
    "crates/koma-app",
    "crates/koma-cli",
    "crates/koma-core",
    "crates/koma-ipc",
]

[workspace.dependencies]
# Keep every Makepad crate on the same reviewed fork commit.
makepad-app-browser-host = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372" }
makepad-app-host = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372" }
makepad-app-terminal = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372", default-features = false }
makepad-apple-sys = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372" }
makepad-browser-view = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372" }
makepad-cef-fetch = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372" }
makepad-micro-serde = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372" }
makepad-platform = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372" }
makepad-studio-protocol = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372" }
makepad-widgets = { git = "https://github.com/tyPhoon-collab/makepad", rev = "3edf6591edb5511a4cc6372c964c398ab4e3e372" }
