[workspace]
resolver = "2"
members = [
    "crates/koma-app",
    "crates/koma-cli",
    "crates/koma-core",
    "crates/koma-ipc",
    "crates/koma-browser-host",
    "crates/koma-cef-fetch",
]
default-members = [
    "crates/koma-app",
    "crates/koma-cli",
    "crates/koma-core",
    "crates/koma-ipc",
]

[workspace.dependencies]
# Keep every Makepad crate on the same reviewed fork commit.
makepad-app-browser-host = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7" }
makepad-app-host = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7" }
makepad-app-terminal = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7", default-features = false }
makepad-apple-sys = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7" }
makepad-browser-view = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7" }
makepad-cef-fetch = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7" }
makepad-micro-serde = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7" }
makepad-platform = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7" }
makepad-studio-protocol = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7" }
makepad-widgets = { git = "https://github.com/tyPhoon-collab/makepad", rev = "1c61de4e7445d2db1311bd4e9d04e1f4fa024fa7" }
