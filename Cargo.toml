[workspace]
resolver = "2"
members = [
    "crates/koma-app",
    "crates/koma-cli",
    "crates/koma-core",
    "crates/koma-ipc",
    "crates/koma-browser-host",
    "crates/koma-cef-fetch",
    "xtask",
]
default-members = [
    "crates/koma-app",
    "crates/koma-cli",
    "crates/koma-core",
    "crates/koma-ipc",
]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
# Keep every Makepad crate on the same reviewed fork commit.
makepad-app-browser-host = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d" }
makepad-app-host = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d" }
makepad-app-terminal = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d", default-features = false }
makepad-apple-sys = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d" }
makepad-browser-view = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d" }
makepad-cef-fetch = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d" }
makepad-micro-serde = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d" }
makepad-platform = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d" }
makepad-studio-protocol = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d" }
makepad-widgets = { git = "https://github.com/tyPhoon-collab/makepad", rev = "29b8b61aa579bf93b0dc8463ae5a51d981b93e7d" }
